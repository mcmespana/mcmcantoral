# .github/workflows/verify.yml
# Job reutilizable de verificación (typecheck + lint + tests). Única fuente
# de verdad: ci.yml y los workflows de publicación (OTA, deploy web) llaman
# a este workflow en vez de duplicar la lista de pasos.
name: Verify

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Los cuatro pasos tardan ~4 min. El timeout está para que un job colgado
    # (un test que espera un timer, npm ci sin red) muera pronto en vez de
    # ocupar un runner las 6 horas que GitHub da por defecto.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run lint
      - run: npm test -- --ci
